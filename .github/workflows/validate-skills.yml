name: Validate skills

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/test-skills.mjs
      - run: node scripts/test-export-ad-reports.mjs
      - run: node scripts/test-workspace-project-manager.mjs
      - run: node scripts/test-lidfly-support-escalation.mjs
      - run: node scripts/test-connection-doctor.mjs
      - run: node scripts/test-client-archives.mjs
